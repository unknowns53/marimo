<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>marimo</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <div id="stage">
        <div id="bubble" role="status" aria-live="polite"></div>
      </div>
      <section id="panel" hidden>
        <div id="panel-toggle" role="group" aria-label="表示の切り替え">
          <button type="button" data-style="detail">詳細</button><button type="button" data-style="counts">件数</button>
        </div>
        <div id="row-order" role="group" aria-label="行の並べ方">
          <button type="button" data-order="started" title="始まった時刻の新しい順に並べます">開始順</button><button type="button" data-order="status" title="承認待ち、エラー、作業中、完了の順に並べます">状態順</button><button type="button" data-order="updated" title="最後に更新された時刻の新しい順に並べます">更新順</button>
        </div>
        <div id="rows"></div>
        <div id="limits" hidden></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
