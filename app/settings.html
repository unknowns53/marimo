<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>marimo の設定</title>
    <link rel="stylesheet" href="/src/settings.css" />
  </head>
  <body>
    <form id="settings">
      <section>
        <h2>表示</h2>
        <label class="check"><input type="checkbox" name="show_character" />絵を表示</label>
        <div class="field">
          <span class="name">パネル</span>
          <div class="choices">
            <label><input type="radio" name="panel_style" value="detail" />詳細</label>
            <label><input type="radio" name="panel_style" value="counts" />件数</label>
          </div>
        </div>
        <div class="field">
          <span class="name">行の並べ方</span>
          <div class="choices">
            <label title="始まった時刻の新しい順に並べます"><input type="radio" name="row_order" value="started" />開始順</label>
            <label title="承認待ち、エラー、作業中、完了の順に並べます"><input type="radio" name="row_order" value="status" />状態順</label>
            <label title="最後に更新された時刻の新しい順に並べます"><input type="radio" name="row_order" value="updated" />更新順</label>
          </div>
        </div>
        <label class="check"><input type="checkbox" name="show_cloud_sessions" />Cloud の会話を表示（手動観測）</label>
        <div class="field">
          <label class="name" for="panel-opacity">背景の不透明度</label>
          <div class="range">
            <input id="panel-opacity" type="range" name="panel_opacity" />
            <output for="panel-opacity" data-for="panel_opacity"></output>
          </div>
        </div>
      </section>

      <section>
        <h2>吹き出し</h2>
        <label class="check"><input type="checkbox" name="bubble_waiting" />承認待ちを出す</label>
        <label class="check"><input type="checkbox" name="bubble_done" />完了を出す</label>
        <label class="check"><input type="checkbox" name="bubble_error" />エラーを出す</label>
        <div class="field">
          <label class="name" for="bubble-seconds">表示時間</label>
          <select id="bubble-seconds" name="bubble_seconds"></select>
        </div>
      </section>

      <section>
        <h2>キャラクター</h2>
        <div class="field">
          <label class="name" for="character">キャラクター</label>
          <select id="character" name="character"></select>
        </div>
        <div class="field">
          <label class="name" for="scale">大きさ</label>
          <div class="range">
            <input id="scale" type="range" name="scale" />
            <output for="scale" data-for="scale"></output>
          </div>
        </div>
      </section>

      <section>
        <h2>起動</h2>
        <label class="check"><input type="checkbox" name="autostart" />ログイン時に起動</label>
      </section>

      <section>
        <h2>更新</h2>
        <div class="field">
          <span class="name">現在のバージョン</span>
          <span id="version"></span>
        </div>
        <div class="buttons">
          <button type="button" id="check-update">更新を確認</button>
          <button type="button" id="install-update" hidden>更新する</button>
        </div>
        <p id="update-status" role="status" aria-live="polite"></p>
      </section>
    </form>

    <dialog id="confirm-update">
      <form method="dialog">
        <p id="confirm-update-text"></p>
        <div class="buttons">
          <button value="cancel">キャンセル</button>
          <button value="ok" class="primary">OK</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
