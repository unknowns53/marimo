[package]
name = "marimo-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "marimo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
marimo-core.workspace = true
notify = "8"
serde.workspace = true
serde_json.workspace = true
# 透過した窓を macOS で出すには macos-private-api が要る。
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
time = { version = "0.3", features = ["parsing"] }

# 利用制限の API を 5 分おきに一度呼ぶだけなので、非同期ランタイムを持たない小さなクライアントにする。
# TLS は macOS と Linux では OS のもの（Security framework と OpenSSL）を使う。
[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls"] }

# Windows の SChannel は、同梱の Mozilla のルート証明書を渡しても OS の証明書ストアにあるルートまで
# 連なりを組むことがあり、native-tls はその連なりに渡したルートが無いと拒む。api.anthropic.com の
# クロス署名された中間証明書で実際にそうなるので、渡したルートで連なりを組む rustls を使う。
[target.'cfg(windows)'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Claude Code の資格情報は macOS ではキーチェーンにしかない。
security-framework = "3"
# アプリのアイコンを NSWorkspace から読む。版は Tauri が引き込むものに揃える。
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSBitmapImageRep",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSWorkspace",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSData",
    "NSDictionary",
    "NSGeometry",
    "NSString",
    "NSURL",
] }

[features]
# 試験用のビルドで、カーソル位置の列を流し込んで開閉の動きを確かめるときだけ有効にする。
cursor-replay = []

[dev-dependencies]
tempfile.workspace = true
