[workspace]
resolver = "3"
members = ["crates/marimo-core", "crates/marimo-hook", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
marimo-core = { path = "crates/marimo-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
