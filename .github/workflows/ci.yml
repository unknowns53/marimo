name: CI

# 文書だけを変えたコミットでは、検査の結果もビルドも変わらないので走らせない。
# 検査はするがビルドはしないファイルの一覧は、下の target ジョブが持つ。
# v で始まるタグの push では正式なリリースを作る。GitHub はタグの push に paths-ignore を当てないので、タグの push は必ず走る。
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE-*'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE-*'
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチに続けて push したときは、古い方の実行を止めてランナーを空ける。
# main と v で始まるタグでの実行では、公開の途中で実行ごと止めると作りかけのリリースが残るので、実行ごとに別のグループにする。
# main で古いビルドを止めるかどうかは、下のジョブごとの concurrency で決める。
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.run_id || 'latest' }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    # タグの付いたコミットは main の実行で検査とビルドを終えているので、そのビルドを写すときは検査し直さない。
    # pull request では target が走らないので、target を待ったうえで、走らなかったときも検査する。
    needs: target
    if: ${{ !cancelled() && needs.target.outputs.reuse == '' }}
    # marimo が対応しているのは macOS と Windows だけなので、Linux では走らせない。
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # tauri::generate_context! は app/dist を読むので、Rust のテストより先に画面部分をビルドする。
      # build は tsc --noEmit も含む。
      - name: Build and test the frontend
        working-directory: app
        run: |
          npm run build
          npm test

      - name: rustfmt
        if: runner.os == 'macOS'
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # 更新用のスクリプトは利用者の端末でしか動かないので、ここでは構文だけを確かめる。
      # Windows では、利用者が使う Windows PowerShell 5.1 と PowerShell 7 の両方で読む。
      # macOS の bash 3.2 は、変数名の直後の非 ASCII のバイトを名前の一部として読み、set -u のもとで止まる。
      # 日本語の直前の変数は ${name} の形で書かれていることも、ここで確かめる。
      - name: Parse the update script (macOS)
        if: runner.os == 'macOS'
        run: |
          bash -n tools/update.sh
          bash -n tools/release.sh
          if perl -ne 'if (/\$[A-Za-z_][A-Za-z0-9_]*[^\x00-\x7F]/) { print "$ARGV:$.: $_"; $bad = 1 } close ARGV if eof; END { exit $bad }' tools/*.sh; then :; else
            echo "::error::日本語の直前の変数を \${name} の形にしてください"
            exit 1
          fi

      - name: Parse the update script (Windows)
        if: runner.os == 'Windows'
        run: |
          foreach ($exe in 'powershell', 'pwsh') {
            & $exe -NoProfile -Command '$e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path tools/update.ps1).ProviderPath, [ref]$null, [ref]$e); if ($e) { $e | Out-String | Write-Host; exit 1 }'
            if ($LASTEXITCODE -ne 0) { throw "$exe で tools/update.ps1 の構文の誤りが見つかりました" }
          }

  # 更新用のスクリプトは、アプリに入るファイルを変えた最後のコミットのビルドを取りに来る。
  # 文書、tools/ の中のスクリプト、art/ の元絵、.gitignore はアプリに入らないので、
  # それらだけを変えた push では、そのコミットのビルドがすでにあればビルドしない。
  # 同じ push の中でそれらだけのコミットが後に続いたときにも見つかるよう、タグもそのコミットの名前で付ける。
  # この一覧を変えるときは、tools/update.sh と tools/update.ps1 の同じ一覧も直す。
  # 中身の変わらないコミットへ force push すると push では CI が起動せず、そのコミットのビルドができない。
  # それを作り直せるよう、main での手動の実行でもビルドと公開を行う。
  # v で始まるタグでの実行では、タグの付いたコミットの build- のプレリリースがあれば、そのファイルを写して
  # タグと同じ名前のリリースとして公開する。無いとき（main の実行がまだ終わっていない、古いビルドが片付けられた）
  # だけ、検査とビルドをやり直す。
  target:
    name: find the build to publish
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.find.outputs.sha || steps.release.outputs.sha }}
      needed: ${{ steps.find.outputs.needed || steps.release.outputs.needed }}
      reuse: ${{ steps.reuse.outputs.tag }}
      formal: ${{ github.ref_type == 'tag' }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find the commit the update scripts look for
        id: find
        if: github.ref_type == 'branch'
        run: |
          sha="$(git log --first-parent -1 --format=%H HEAD -- . ':(exclude)*.md' ':(exclude)docs' ':(exclude)LICENSE-*' ':(exclude)tools' ':(exclude)art' ':(exclude).gitignore')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if gh release view "build-${sha::12}" >/dev/null 2>&1; then
            echo "build-${sha::12} はすでにあるので、ビルドしません"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      # アプリが名乗るバージョンとリリースの名前が食い違わないよう、タグのバージョンが四つのファイルのバージョンとそろっていなければビルドしない。
      # main を通っていないコミットは main の検査を経ていないので、正式なリリースにしない。
      - name: Check the version tag
        id: release
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sha="$(git rev-parse 'HEAD^{commit}')"
          python3 - "$TAG" <<'EOF'
          import json
          import sys
          import tomllib

          tag = sys.argv[1]
          want = tag.removeprefix('v')

          def load_json(path):
              with open(path, encoding='utf-8') as f:
                  return json.load(f)

          with open('Cargo.toml', 'rb') as f:
              cargo = tomllib.load(f)
          lock = load_json('app/package-lock.json')
          found = {
              'Cargo.toml の [workspace.package] version': cargo['workspace']['package']['version'],
              'app/src-tauri/tauri.conf.json の version': load_json('app/src-tauri/tauri.conf.json')['version'],
              'app/package.json の version': load_json('app/package.json')['version'],
              'app/package-lock.json の version': lock['version'],
              'app/package-lock.json の packages[""].version': lock['packages']['']['version'],
          }
          wrong = [f'{where} は {version}' for where, version in found.items() if version != want]
          if wrong:
              print(f'::error::タグ {tag} のバージョン {want} がファイルのバージョンと合いません（' + '、'.join(wrong) + '）。バージョンを直して main へコミットし、そのコミットにタグを付け直してください。')
              sys.exit(1)
          print(f'タグ {tag} のバージョン {want} は四つのファイルのバージョンとそろっています')
          EOF
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::タグ $TAG の付いたコミット ${sha::12} は main に入っていません。main へ入れたコミットにタグを付け直してください。"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "needed=true" >> "$GITHUB_OUTPUT"

      # main の実行は、アプリに入るファイルを変えた最後のコミットの名前で build- を作るので、同じ規則で探す。
      # バージョンのファイルはアプリに入るので、見つかったビルドもタグと同じバージョンを名乗っている。
      - name: Find the main build of the tagged commit
        id: reuse
        if: github.ref_type == 'tag'
        env:
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          app="$(git log --first-parent -1 --format=%H "$SHA" -- . ':(exclude)*.md' ':(exclude)docs' ':(exclude)LICENSE-*' ':(exclude)tools' ':(exclude)art' ':(exclude).gitignore')"
          build="build-${app::12}"
          assets="$(gh release view "$build" --json assets --jq '[.assets[].name] | sort | join(" ")' 2>/dev/null || true)"
          if [[ "$assets" == "SHA256SUMS marimo-macos-arm64.tar.gz marimo-windows-x64.zip" ]]; then
            echo "$build のファイルを写して公開します"
            echo "tag=$build" >> "$GITHUB_OUTPUT"
          else
            echo "$build のファイルがそろっていないので、検査とビルドをやり直します"
          fi

  # 利用者の Mac は arm64 なので、arm64 のランナーである macos-latest でビルドする。
  build-macos:
    name: build (macOS arm64)
    needs: [test, target]
    if: needs.target.outputs.needed == 'true' && needs.target.outputs.reuse == ''
    runs-on: macos-latest
    # 新しいコミットのビルドが始まったら、古いコミットのビルドは要らなくなるので止める。
    concurrency:
      group: build-macos-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build marimo-hook
        run: cargo build --release -p marimo-hook

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Build the app bundle
        working-directory: app
        run: npm run tauri -- build --bundles app

      # zip や upload-artifact はシンボリックリンクと実行権を保てないので、tar で固めてから渡す。
      # COPYFILE_DISABLE は、macOS の tar が拡張属性を ._ で始まるファイルとして混ぜるのを止める。
      - name: Package
        run: |
          mkdir -p dist stage
          ditto target/release/bundle/macos/marimo.app stage/marimo.app
          cp target/release/marimo-hook stage/marimo-hook
          COPYFILE_DISABLE=1 tar -czf dist/marimo-macos-arm64.tar.gz -C stage marimo.app marimo-hook
          tar -tzvf dist/marimo-macos-arm64.tar.gz | head -n 20

      - uses: actions/upload-artifact@v7
        with:
          name: marimo-macos-arm64
          path: dist/marimo-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 3

  build-windows:
    name: build (Windows x64)
    needs: [test, target]
    if: needs.target.outputs.needed == 'true' && needs.target.outputs.reuse == ''
    runs-on: windows-latest
    concurrency:
      group: build-windows-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build marimo-hook
        run: cargo build --release -p marimo-hook

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund

      # npm.ps1 を経由すると PowerShell が引数の -- を取り除くことがあるので、npm.cmd を直接呼ぶ。
      - name: Build the NSIS installer
        working-directory: app
        run: npm.cmd run tauri -- build --bundles nsis

      - name: Package
        run: |
          $installer = @(Get-ChildItem -Path target\release\bundle\nsis -Filter 'marimo_*_x64-setup.exe')
          if ($installer.Count -ne 1) { throw "インストーラがちょうど一つではありません: $($installer.Count) 個" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path $installer[0].FullName, target\release\marimo-hook.exe -DestinationPath dist\marimo-windows-x64.zip
          Get-Item dist\marimo-windows-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: marimo-windows-x64
          path: dist/marimo-windows-x64.zip
          if-no-files-found: error
          retention-days: 3

  # 両方のビルドが成功したときだけリリースを作るよう、公開は別のジョブにまとめる。
  # リリースを書き換えられる権限は、このジョブにだけ渡す。
  publish:
    name: publish
    needs: [target, build-macos, build-windows]
    # ビルドを写すときは二つのビルドのジョブが飛ばされるので、そのときだけビルドの成功を求めない。
    if: >-
      ${{ !cancelled() && needs.target.result == 'success' && needs.target.outputs.needed == 'true' &&
      (needs.target.outputs.reuse != '' || (needs.build-macos.result == 'success' && needs.build-windows.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 公開と古いビルドの片付けは途中で止めると半端なリリースが残るので、次の push が来ても最後まで走らせる。
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    # 既定の bash は pipefail を付けないので、gh release list の失敗が while に隠れないよう明示する。
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        if: needs.target.outputs.reuse == ''
        with:
          pattern: marimo-*
          path: dist
          merge-multiple: true

      - name: Copy the main build
        if: needs.target.outputs.reuse != ''
        env:
          BUILD: ${{ needs.target.outputs.reuse }}
        run: |
          gh release download "$BUILD" --dir dist --pattern marimo-macos-arm64.tar.gz --pattern marimo-windows-x64.zip --pattern SHA256SUMS
          cd dist
          sha256sum -c SHA256SUMS

      - name: Write SHA256SUMS
        if: needs.target.outputs.reuse == ''
        working-directory: dist
        run: |
          sha256sum marimo-macos-arm64.tar.gz marimo-windows-x64.zip > SHA256SUMS
          cat SHA256SUMS

      # 更新用のスクリプトは build-<コミットの先頭 12 文字> のタグからビルドを探す。
      # 失敗した実行をやり直したときにも通るよう、リリースがあれば中身だけを差し替える。
      - name: Publish the prerelease
        if: needs.target.outputs.formal != 'true'
        working-directory: dist
        env:
          SHA: ${{ needs.target.outputs.sha }}
        run: |
          tag="build-${SHA::12}"
          files=(marimo-macos-arm64.tar.gz marimo-windows-x64.zip SHA256SUMS)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --target "$SHA" \
              --prerelease \
              --title "main build ${SHA::12}" \
              --notes "main のコミット ${SHA} を自動でビルドしたものです。tools/update.sh と tools/update.ps1 がこのビルドを取りに来ます。"
          fi

      # 更新用のスクリプトは、既定では GitHub が Latest と示す正式なリリースを取りに来る。
      # SemVer では - の後ろがプレリリースを表すので、v0.2.0-rc.1 のようなタグはプレリリースにして、Latest にしない。
      # --verify-tag は、push されたタグが消されていたときに、gh が既定のブランチの先端へ新しくタグを作るのを止める。
      - name: Publish the release
        if: needs.target.outputs.formal == 'true'
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
        run: |
          files=(marimo-macos-arm64.tar.gz marimo-windows-x64.zip SHA256SUMS)
          if [[ "$TAG" == *-* ]]; then
            kind=(--prerelease --latest=false)
          else
            kind=(--latest)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --verify-tag \
              "${kind[@]}" \
              --title "marimo $TAG" \
              --generate-notes
          fi

      # build- で始まるプレリリースだけを消し、v で始まるリリースとプレリリースを含むほかのリリースとタグには触れない。
      - name: Delete old builds
        run: |
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("build-")))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
            while read -r old; do
              echo "古いビルド $old を消します"
              gh release delete "$old" --yes --cleanup-tag
            done
